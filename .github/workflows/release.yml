name: Release

on:
  push:
    branches: [ fork, drop+ci ]
  pull_request:
    branches: [ fork, drop+ci ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  LLVM_SYS_211_PREFIX: /usr/lib/llvm-21

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
    - name: Install Rust
      run: |
        sudo apt-get update
        sudo apt-get install -y cargo rustc musl-dev
        rustc --version
        cargo --version
    - name: Install LLVM 21
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 21 all
    - name: Build release binary
      run: cargo build --release
    - name: Upload artifact
      if: github.event_name != 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: ante
        path: target/release/ante

  build-static-musl:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
    - name: Install Rust
      run: |
        sudo apt-get install musl-dev
    - name: Build static musl binary
      run: .github/build.sh
    - name: Upload artifact
      if: github.event_name != 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: ante-static-musl-linux-x86_64
        path: target/x86_64-unknown-linux-musl/release/ante

  publish-docker-static-musl:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
    - name: Install Rust
      run: |
        sudo apt-get install musl-dev
    - name: Build static musl binary
      # minicoro is linked in as a precompiled object rather than the .c
      # source, so ante is built to look for it at /minicoro.o - the path
      # it lives at in the image below.
      run: ANTE_MINICORO_PATH=/minicoro.o .github/build.sh
    - name: Compile minicoro.o
      run: cc -c -O0 -w aminicoro/minicoro.c -o minicoro.o
    - uses: docker/setup-buildx-action@v3
    - name: Log in to GHCR
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and publish image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: .github/docker/Dockerfile
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          ghcr.io/${{ github.repository }}:static-musl
          ghcr.io/${{ github.repository }}:static-musl-${{ github.sha }}
